021Bia \xEE\u021Bi aminte\u0219te printr-o bar\u0103 sus.",'Butonul nou \u201ETrimite backup pe e-mail" deschide fereastra de partajare cu fi\u0219ierul deja ata\u0219at \u2014 nu mai trebuie s\u0103-l cau\u021Bi prin Desc\u0103rc\u0103ri.']},{v:"v2.13.6",titlu:"Activare mai simpl\u0103",puncte:["La prima deschidere, aplica\u021Bia \xEE\u021Bi arat\u0103 identificatorul telefonului t\u0103u \u0219i \u021Bi-l trimite mie cu un buton \u2014 pe baza lui prime\u0219ti codul de acces, legat de telefonul acesta."]},{v:"v2.12.6",titlu:"Programul, pe m\u0103sura ta",puncte:["Durata unei \u0219edin\u021Be se alege din Set\u0103ri \u2014 de la 30 de minute la 3 ore. \u0218edin\u021Bele deja programate r\u0103m\xE2n cu durata lor.","Tot din Set\u0103ri alegi pasul orelor: din 5, 10, 15, 30 sau 60 \xEEn 60 de minute. Sub jum\u0103tate de or\u0103, calendarul arat\u0103 orele \xEEntregi, iar minutul \xEEl alegi la atingere.","\xCEn Plan po\u021Bi bifa dintr-o dat\u0103 to\u021Bi elevii, iar pentru fiecare po\u021Bi cere s\u0103 intre \u0219i \u0219edin\u021Bele \u021Binute \xEEn rezerv\u0103 pentru preg\u0103tirea de dinaintea examenului.","Lista elevilor \xEEn curs se pliaz\u0103 la fel ca cea a promova\u021Bilor, iar butonul de ad\u0103ugare nu mai acoper\u0103 ultimul elev."]},{v:"v2.11.5",titlu:'Prezentare \u0219i \u201ECe e nou"',puncte:["La prima pornire, aplica\u021Bia \xEE\u021Bi spune pe scurt ce face \u0219i unde stau datele tale.","La fiecare versiune nou\u0103 vezi, o singur\u0103 dat\u0103, ce s-a schimbat. Le po\u021Bi redeschide oric\xE2nd din Set\u0103ri."]},{v:"v2.10.5",titlu:"Acces pe perioad\u0103",puncte:["Aplica\u021Bia se deschide cu un cod primit o singur\u0103 dat\u0103, pe telefonul t\u0103u.","C\xE2nd perioada se \xEEncheie, datele r\u0103m\xE2n \xEEntregi: le vezi \u0219i \xEE\u021Bi descarci backup-ul oric\xE2nd, doar modific\u0103rile se opresc p\xE2n\u0103 la prelungire."]},{v:"v2.9.5",titlu:"Raport de elevi",puncte:['\xCEn Elevi ai butonul \u201ERaport": pentru fiecare elev vezi totalul de ore, c\xE2te a efectuat, c\xE2te are programate \u0219i c\xE2te \xEEi r\u0103m\xE2n.',"Sub nume \xEE\u021Bi spune \u0219i c\xE2te ore mai are de programat \u2014 \u0103sta e num\u0103rul care \xEE\u021Bi zice pe cine s\u0103 suni.","Alegi tu cine intr\u0103 \xEEn raport, iar la final \xEEl po\u021Bi salva ca PDF sau fotografia pentru \u0219coal\u0103."]},{v:"v2.7.5",titlu:"Ajutor \u0219i feedback",puncte:["Din Set\u0103ri \xEEmi trimi\u021Bi direct o problem\u0103 sau o sugestie, cu un buton.","Din mesaj pleac\u0103 doar informa\u021Bii despre aplica\u021Bie \u0219i telefon \u2014 niciun nume \u0219i niciun num\u0103r al elevilor t\u0103i."]},{v:"v2.6.5",titlu:"Aplica\u021Bie adev\u0103rat\u0103 pe telefon",puncte:["Se instaleaz\u0103 cu iconi\u021B\u0103 proprie \u0219i porne\u0219te pe tot ecranul, f\u0103r\u0103 barele browserului.","Merge \u0219i f\u0103r\u0103 internet, iar ecranul se poate roti.","Bara cu file a cobor\xE2t jos, la \xEEndem\xE2na degetului mare."]},{v:"v2.5.3",titlu:"Elevii promova\u021Bi, deoparte",puncte:["Cei cu permisul luat trec \xEEntr-un grup al lor, ca lista de lucru s\u0103 r\u0103m\xE2n\u0103 curat\u0103. \xCEi g\u0103se\u0219ti oric\xE2nd dedesubt, l\xE2ng\u0103 cei retra\u0219i."]},{v:"v2.4.1",titlu:"Butoane mai u\u0219or de nimerit",puncte:["Cercul de WhatsApp e mai mare \u0219i nu-\u021Bi mai fur\u0103 ap\u0103sarea cardul elevului, deci nu mai deschizi fi\u0219a din gre\u0219eal\u0103.","Num\u0103rul de telefon s-a dep\u0103rtat de el, ca s\u0103 nu suni c\xE2nd voiai s\u0103 scrii."]},{v:"v2.1.1",titlu:"Ziua de examen",puncte:["\xCEn ziua examenului practic, ma\u0219ina apare ocupat\u0103 diminea\u021Ba 08:30\u201312:30 sau dup\u0103-amiaza 13:00\u201317:00.","Calendarul te avertizeaz\u0103 dac\u0103 programezi o \u0219edin\u021B\u0103 peste acel interval, dar te las\u0103 s\u0103 o faci dac\u0103 \u0219tii ce faci."]},{v:"v2.0.0",titlu:"Pl\u0103\u021Bi corectabile",puncte:["Orice plat\u0103 gre\u0219it\u0103 se poate corecta \u2014 sum\u0103, dat\u0103, cine a \xEEncasat \u2014 sau se poate \u0219terge.","Datoria elevului se recalculeaz\u0103 singur\u0103 dup\u0103 fiecare \xEEndreptare."]},{v:"v1.32.9",titlu:"Istoricul pl\u0103\u021Bilor",puncte:["\xCEn Finan\u021Be vezi toate pl\u0103\u021Bile lunii, cu elevul, data \u0219i cine a \xEEncasat banii."]},{v:"v1.32.0",eticheta:"p\xE2n\u0103 la v1.32.9",titlu:"Bani, taxe \u0219i salariu",puncte:["Taxele le stabile\u0219ti tu \xEEn Finan\u021Be \u2014 reexaminare, dosar, orice \u2014 \u0219i le pui pe cardul elevului cu plus \u0219i minus.","O tax\u0103 poate fi \u0219i pachet: dac\u0103 \xEEi treci ore, bifarea ei adaug\u0103 automat orele suplimentare elevului, iar acele ore nu se mai taxeaz\u0103 \xEEnc\u0103 o dat\u0103 la bucat\u0103.","Pl\u0103\u021Bile se pot \xEEncasa de tine sau direct la \u0219coal\u0103; datoria scade la fel, dar la \xEEncas\u0103rile tale intr\u0103 doar ce a trecut prin m\xE2na ta.","Salariul de la angajator se calculeaz\u0103 singur: un prag de \u0219edin\u021Be pe lun\u0103 la tariful de baz\u0103, restul la tariful de peste program, cu tarife separate pentru \u0219edin\u021Bele \xEEn englez\u0103.","Zilele lucr\u0103toare ale lunii se calculeaz\u0103 automat, dar le po\u021Bi corecta manual c\xE2nd e s\u0103rb\u0103toare."]},{v:"v1.31.0",eticheta:"p\xE2n\u0103 la v1.32.9",titlu:"Planificare pe m\u0103sura fiec\u0103rui elev",puncte:["Pe fi\u0219a elevului scrii c\xE2nd poate veni: intervalul orar, zilele s\u0103pt\u0103m\xE2nii, doar zile pare sau impare \u0219i ritmul minim \xEEntre \u0219edin\u021Be. Planificatorul le respect\u0103 pe toate.","Po\u021Bi cere gruparea pe zone, ca \u0219edin\u021Bele apropiate s\u0103 fie una dup\u0103 alta \u0219i s\u0103 nu traversezi ora\u0219ul \xEEntre ele.","Ultimele trei \u0219edin\u021Be ale fiec\u0103rui elev se p\u0103streaz\u0103 pentru preg\u0103tirea de dinaintea examenului \u0219i se a\u0219az\u0103 cu 1\u20135 zile \xEEnainte de el.","C\xE2nd r\u0103m\xE2ne un gol \xEEntre dou\u0103 \u0219edin\u021Be, calendarul \xEE\u021Bi propune singur elevii care l-ar putea umple.","Po\u021Bi marca intervale \xEEn care nu e\u0219ti disponibil, iar calendarul te avertizeaz\u0103 dac\u0103 programezi peste ele.","Un calculator \xEE\u021Bi arat\u0103 \xEEn c\xE2te zile termini tot ce ai de f\u0103cut \u0219i c\xE2t ar \xEEnsemna asta \xEEn bani."]},{v:"v1.30.0",eticheta:"p\xE2n\u0103 la v1.32.9",titlu:"Elevii \u0219i leg\u0103tura cu ei",puncte:["Mesaje gata scrise pentru WhatsApp sau SMS la programare, reprogramare \u0219i anulare, plus trimiterea \xEEntregului program al elevului. Le po\u021Bi schimba \xEEnainte de trimitere.","Mementouri pe fi\u0219a elevului: scrii la a c\xE2ta \u0219edin\u021B\u0103 vrei s\u0103-\u021Bi aminte\u0219ti ceva, iar \xEEn ziua aceea \xEE\u021Bi apare pe Acas\u0103.","Po\u021Bi trimite un elev, cu tot cu \u0219edin\u021Bele lui, altui instructor \u2014 \u0219i po\u021Bi primi la fel de la el.","\u0218edin\u021Bele f\u0103cute de alt instructor se trec doar ca eviden\u021B\u0103: consum\u0103 orele elevului, dar nu-\u021Bi blocheaz\u0103 calendarul \u0219i nu intr\u0103 la salariu.","Elevii retra\u0219i trec \xEEntr-un grup separat, f\u0103r\u0103 s\u0103 li se piard\u0103 datele.","Pe Acas\u0103 vezi c\xE2\u021Bi elevi ai promovat \u0219i cum stau examenele teoretice \u0219i practice, cu num\u0103rul de sus\u021Bineri."]}];function zA({open:n,onClose:e,onNoutati:t}){if(!n)return null;let a=(i,r)=>l.default.createElement("div",{className:"mb-3"},l.default.createElement("div",{className:"text-sm font-medium text-slate-800"},i),l.default.createElement("div",{className:"text-xs text-slate-500 mt-0.5"},r));return l.default.createElement(Tr,{open:n,onClose:e,title:`Bun venit \xEEn ${qn.mark}`,layer:Qt.dialog,footer:l.default.createElement("div",{className:"flex gap-2.5"},l.default.createElement("button",{onClick:t,className:"flex-1 py-3 rounded-xl border border-slate-20           --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20); --track:rgba(255,255,255,.11);
          --accent:#e0a13a; --accent-ink:#f0c579; --accent-soft:rgba(224,161,58,.15); --accent-line:rgba(224,161,58,.34);
          --ok:#4cc79a; --ok-soft:rgba(76,199,154,.14); --ok-line:rgba(76,199,154,.3);
          --info:#7fb0ef; --info-soft:rgba(127,176,239,.14); --info-line:rgba(127,176,239,.3);

          --violet:#b09ae8;

        }

        /* --------- clasele existente, redirec\u021Bionate spre jetoane --------- */
        [data-skin] .bg-white{background-color:var(--surface)}

        [data-skin] .bg-red-400,[data-skin] .bg-red-500,[data-skin] .bg-red-600{background-color:var(--bad)}
        [data-skin] .text-slate-900,[data-skin] .text-slate-800{color:var(--text)}
        [data-skin] .text-slate-700,[data-skin] .text-slate-600{color:var(--text-2)}

        [data-skin] .text-emerald-600,[data-skin] .text-emerald-700,[data-skin] .text-emerald-800{color:var(--ok)}
        [data-skin] .text-blue-700{color:var(--info)}
        [data-skin] .text-red-500,[data-skin] .text-red-600,[data-skin] .text-red-700{color:var(--bad)}

        [data-skin] .text-violet-600{color:var(--violet)}
        [data-skin] .border-slate-100,[data-skin] .border-slate-200{border-color:var(--line)}

        [data-skin] .border-slate-900{border-color:var(--invert)}
        [data-skin] .border-amber-200,[data-skin] .border-amber-300{border-color:var(--accent-line)}
        [data-skin] .border-emerald-200{border-color:var(--ok-line)}
        [data-skin] .border-blue-200{border-color:var(--info-line)}

        /* ------------------------- limbaj vizual ------------------------- */
        [data-skin] .rounded-xl{border-radius:15px}

        [data-skin] .text-xs.font-medium.uppercase.tracking-wide::before{

        /* ---------------- \xCENCADRARE PE ORICE L\u0102\u021AIME DE ECRAN ----------------
           Un <select> sau un <input> cere implicit o l\u0103\u021Bime minim\u0103 dat\u0103 de cel
           mai lung text din el. \xCEn grilele de dou\u0103 coloane asta \xEEmpingea
           formularul dincolo de marginea ecranelor \xEEnguste, iar telefonul
           compensa mic\u0219or\xE2nd toat\u0103 pagina. L\u0103\u021Bimea minim\u0103 zero le las\u0103 s\u0103 se
           str\xE2ng\u0103 \xEEn coloana lor, oric\xE2t de \xEEngust ar fi ecranul. */

        [data-skin] { overflow-x: hidden; }
        [data-skin] input, [data-skin] select, [data-skin] textarea { min-width: 0; max-width: 100%; }
        [data-skin] .grid > * { min-width: 0; }

        [data-skin].min-h-screen {

<script>
  var b = document.getElementById('boot');
  if (b && b.parentNode) b.parentNode.removeChild(b);

  // Rotirea ecranului rămâne la latitudinea telefonului. Dacă instalarea a
  // păstrat o blocare mai veche pe portret, o eliberăm aici.
  try {
    if (window.screen && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch (e) { /* browserul nu permite — rămâne cum e */ }

  // Instalarea pe telefon și pornirea fără internet. Când urci o versiune nouă,
  // aplicația o preia singură și se reîncarcă o dată, fără să pierzi date.
  if ('serviceWorker' in navigator) {
    window.__iasSW = { eroare: '' };
    window.addEventListener('load', function () {
      var aveaVersiune = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        window.__iasSW.eroare = (e && e.message) ? e.message : String(e);
      });
      if (aveaVersiune) {
        var reincarc = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reincarc) return;
          reincarc = true;
          window.location.reload();
        });
      }
    });
  } else {
    window.__iasSW = { eroare: 'Browserul nu acceptă lucrători de fundal (fereastră privată?).' };
  }
</script>
