2.13.6",titlu:"Activare mai simpl\u0103",puncte:["La prima deschidere, aplica\u021Bia \xEE\u021Bi arat\u0103 identificatorul telefonului t\u0103u \u0219i \u021Bi-l trimite mie cu un buton \u2014 pe baza lui prime\u0219ti codul de acces, legat de telefonul acesta."]},{v:"v2.12.6",titlu:"Programul, pe m\u0103sura ta",puncte:["Durata unei \u0219edin\u021Be se alege din Set\u0103ri \u2014 de la 30 de minute la 3 ore. \u0218edin\u021Bele deja programate r\u0103m\xE2n cu durata lor.","Tot din Set\u0103ri alegi pasul orelor: din 5, 10, 15, 30 sau 60 \xEEn 60 de minute. Sub jum\u0103tate de or\u0103, calendarul arat\u0103 orele \xEEntregi, iar minutul \xEEl alegi la atingere.","\xCEn Plan po\u021Bi bifa dintr-o dat\u0103 to\u021Bi elevii, iar pentru fiecare po\u021Bi cere s\u0103 intre \u0219i \u0219edin\u021Bele \u021Binute \xEEn rezerv\u0103 pentru preg\u0103tirea de dinaintea examenului.","Lista elevilor \xEEn curs se pliaz\u0103 la fel ca cea a promova\u021Bilor, iar butonul de ad\u0103ugare nu mai acoper\u0103 ultimul elev."]},{v:"v2.11.5",titlu:'Prezentare \u0219i \u201ECe e nou"',puncte:["La prima pornire, aplica\u021Bia \xEE\u021Bi spune pe scurt ce face \u0219i unde stau datele tale.","La fiecare versiune nou\u0103 vezi, o singur\u0103 dat\u0103, ce s-a schimbat. Le po\u021Bi redeschide oric\xE2nd din Set\u0103ri."]},{v:"v2.10.5",titlu:"Acces pe perioad\u0103",puncte:["Aplica\u021Bia se deschide cu un cod primit o singur\u0103 dat\u0103, pe telefonul t\u0103u.","C\xE2nd perioada se \xEEncheie, datele r\u0103m\xE2n \xEEntregi: le vezi \u0219i \xEE\u021Bi descarci backup-ul oric\xE2nd, doar modific\u0103rile se opresc p\xE2n\u0103 la prelungire."]},{v:"v2.9.5",titlu:"Raport de elevi",puncte:['\xCEn Elevi ai butonul \u201ERaport": pentru fiecare elev vezi totalul de ore, c\xE2te a efectuat, c\xE2te are programate \u0219i c\xE2te \xEEi r\u0103m\xE2n.',"Sub nume \xEE\u021Bi spune \u0219i c\xE2te ore mai are de programat \u2014 \u0103sta e num\u0103rul care \xEE\u021Bi zice pe cine s\u0103 suni.","Alegi tu cine intr\u0103 \xEEn raport, iar la final \xEEl po\u021Bi salva ca PDF sau fotografia pentru \u0219coal\u0103."]},{v:"v2.7.5",titlu:"Ajutor \u0219i feedback",puncte:["Din Set\u0103ri \xEEmi trimi\u021Bi direct o problem\u0103 sau o sugestie, cu un buton.","Din mesaj pleac\u0103 doar informa\u021Bii despre aplica\u021Bie \u0219i telefon \u2014 niciun nume \u0219i niciun num\u0103r al elevilor t\u0103i."]},{v:"v2.6.5",titlu:"Aplica\u021Bie adev\u0103rat\u0103 pe telefon",puncte:["Se instaleaz\u0103 cu iconi\u021B\u0103 proprie \u0219i porne\u0219te pe tot ecranul, f\u0103r\u0103 barele browserului.","Merge \u0219i f\u0103r\u0103 internet, iar ecranul se poate roti.","Bara cu file a cobor\xE2t jos, la \xEEndem\xE2na degetului mare."]},{v:"v2.5.3",titlu:"Elevii promova\u021Bi, deoparte",puncte:["Cei cu permisul luat trec \xEEntr-un grup al lor, ca lista de lucru s\u0103 r\u0103m\xE2n\u0103 curat\u0103. \xCEi g\u0103se\u0219ti oric\xE2nd dedesubt, l\xE2ng\u0103 cei retra\u0219i."]},{v:"v2.4.1",titlu:"Butoane mai u\u0219or de nimerit",puncte:["Cercul de WhatsApp e mai mare \u0219i nu-\u021Bi mai fur\u0103 ap\u0103sarea cardul elevului, deci nu mai deschizi fi\u0219a din gre\u0219eal\u0103.","Num\u0103rul de telefon s-a dep\u0103rtat de el, ca s\u0103 nu suni c\xE2nd voiai s\u0103 scrii."]},{v:"v2.1.1",titlu:"Ziua de examen",puncte:["\xCEn ziua examenului practic, ma\u0219ina apare ocupat\u0103 diminea\u021Ba 08:30\u201312:30 sau dup\u0103-amiaza 13:00\u201317:00.","Calendarul te avertizeaz\u0103 dac\u0103 programezi o \u0219edin\u021B\u0103 peste acel interval, dar te las\u0103 s\u0103 o faci dac\u0103 \u0219tii ce faci."]},{v:"v2.0.0",titlu:"Pl\u0103\u021Bi corectabile",puncte:["Orice plat\u0103 gre\u0219it\u0103 se poate corecta \u2014 sum\u0103, dat\u0103, cine a \xEEncasat \u2014 sau se poate \u0219terge.","Datoria elevului se recalculeaz\u0103 singur\u0103 dup\u0103 fiecare \xEEndreptare."]},{v:"v1.32.9",titlu:"Istoricul pl\u0103\u021Bilor",puncte:["\xCEn Finan\u021Be vezi toate pl\u0103\u021Bile lunii, cu elevul, data \u0219i cine a \xEEncasat banii."]},{v:"v1.32.0",eticheta:"p\xE2n\u0103 la v1.32.9",titlu:"Bani, taxe \u0219i salariu",puncte:["Taxele le stabile\u0219ti tu \xEEn Finan\u021Be \u2014 reexaminare, dosar, orice \u2014 \u0219i le pui pe cardul elevului cu plus \u0219i minus.","O tax\u0103 poate fi \u0219i pachet: dac\u0103 \xEEi treci ore, bifarea ei adaug\u0103 automat orele suplimentare elevului, iar acele ore nu se mai taxeaz\u0103 \xEEnc\u0103 o dat\u0103 la bucat\u0103.","Pl\u0103\u021Bile se pot \xEEncasa de tine sau direct la \u0219coal\u0103; datoria scade la fel, dar la \xEEncas\u0103rile tale intr\u0103 doar ce a trecut prin m\xE2na ta.","Salariul de la angajator se calculeaz\u0103 singur: un prag de \u0219edin\u021Be pe lun\u0103 la tariful de baz\u0103, restul la tariful de peste program, cu tarife separate pentru \u0219edin\u021Bele \xEEn englez\u0103.","Zilele lucr\u0103toare ale lunii se calculeaz\u0103 automat, dar le po\u021Bi corecta manual c\xE2nd e s\u0103rb\u0103toare."]},{v:"v1.31.0",eticheta:"p\xE2n\u0103 la v1.32.9",titlu:"Planificare pe m\u0103sura fiec\u0103rui elev",puncte:["Pe fi\u0219a elevului scrii c\xE2nd poate veni: intervalul orar, zilele s\u0103pt\u0103m\xE2nii, doar zile pare sau impare \u0219i ritmul minim \xEEntre \u0219edin\u021Be. Planificatorul le respect\u0103 pe toate.","Po\u021Bi cere gruparea pe zone, ca \u0219edin\u021Bele apropiate s\u0103 fie una dup\u0103 alta \u0219i s\u0103 nu traversezi ora\u0219ul \xEEntre ele.","Ultimele trei \u0219edin\u021Be ale fiec\u0103rui elev se p\u0103streaz\u0103 pentru preg\u0103tirea de dinaintea examenului \u0219i se a\u0219az\u0103 cu 1\u20135 zile \xEEnainte de el.","C\xE2nd r\u0103m\xE2ne un gol \xEEntre dou\u0103 \u0219edin\u021Be, calendarul \xEE\u021Bi propune singur elevii care l-ar putea umple.","Po\u021Bi marca intervale \xEEn care nu e\u0219ti disponibil, iar calendarul te avertizeaz\u01         /* ================= SISTEM DE CULORI =================
           Un singur design. Ziua = jetoanele de mai jos; noaptea = ACELEA\u0218I
           jetoane, doar cobor\xE2te \xEEn luminozitate. Nimic nu se rescrie \xEEn
           interfa\u021B\u0103 \u2014 se schimb\u0103 doar valorile. */
        :root{
          --bg:#e9eef6; --bg-tint:rgba(245,158,11,.16);
          --surface:#ffffff; --surface-2:#eef3f9; --field:#eef3f9;
          --invert:#0f1d31; --on-invert:#ffffff;
          --text:#0c1a2b; --text-2:#33475e; --muted:#556a83; --muted-2:#6b8099; --faint:#8b9db4;
          --line:rgba(12,26,43,.11); --line-2:rgba(12,26,43,.20); --track:rgba(12,26,43,.10);
          --accent:#f0900b; --accent-ink:#8a4f04; --accent-soft:rgba(240,144,11,.13); --accent-line:rgba(240,144,11,.34);
          --ok:#00875a; --ok-soft:rgba(0,135,90,.11); --ok-line:rgba(0,135,90,.28);
          --info:#1f6fd0; --info-soft:rgba(31,111,208,.10); --info-line:rgba(31,111,208,.26);
          --bad:#d0342c; --bad-soft:rgba(208,52,44,.10); --bad-line:rgba(208,52,44,.26);
          --sky:#0b74a8; --sky-soft:rgba(11,116,168,.10); --sky-line:rgba(11,116,168,.26);
          --violet:#6d3fd4;
          --shadow:0 1px 2px rgba(12,26,43,.05), 0 10px 26px rgba(12,26,43,.08);
          --shadow-lg:0 20px 46px rgba(12,26,43,.20);
        }
        [data-skin="dark"]{
          --bg:#080d16; --bg-tint:rgba(240,144,11,.06);
          --surface:#121c2c; --surface-2:#0e1725; --field:#182434;
          --invert:#1d2c42; --on-invert:#e8eff8;
          --text:#e6edf6; --text-2:#c3d0e0; --muted:#94a6bd; --muted-2:#8598b0; --faint:#71849c;
          --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20); --track:rgba(255,255,255,.11);
          --accent:#e0a13a; --accent-ink:#f0c579; --accent-soft:rgba(224,161,58,.15); --accent-line:rgba(224,161,58,.34);
          --ok:#4cc79a; --ok-soft:rgba(76,199,154,.14); --ok-line:rgba(76,199,154,.3);
          --info:#7fb0ef; --info-soft:rgba(127,176,239,.14); --info-line:rgba(127,176,239,.3);
          --bad:#ef8b84; --bad-soft:rgba(239,139,132,.14); --bad-line:rgba(239,139,132,.3);
          --sky:#6cc0e8; --sky-soft:rgba(108,192,232,.14); --sky-line:rgba(108,192,232,.3);
          --violet:#b09ae8;
          --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 20px 46px rgba(0,0,0,.6);
        }

        [data-skin] input.bg-white,[data-skin] select.bg-white,[data-skin] textarea.bg-white{background-color:var(--field)}
        [data-skin] ::placeholder{color:var(--faint);opacity:1}
        [data-skin] option{background:var(--surface);color:var(--text)}
        [data-skin] input[type="number"],[data-skin] input[type="date"],[data-skin] input[type="time"]{color:var(--text);background-color:var(--field)}

        /* semn\u0103tura IAS: liniu\u021B\u0103 de marcaj rutier la titluri de sec\u021Biune */
        [data-skin] .text-xs.font-medium.uppercase.tracking-wide::before{
          content:'';display:inline-block;width:15px;height:2px;border-radius:2px;
          background:var(--accent);margin-right:8px;vertical-align:middle;position:relative;top:-1px;
        }
        [data-skin] h1.font-display.text-xl::after{
          content:'';display:block;width:38px;height:3px;border-radius:3px;margin-top:7px;
          background:linear-gradient(90deg,var(--accent),transparent);
        }
        [data-skin] nav.bg-white{backdrop-filter:blur(14px)}

        /* ---------------- \xCENCADRARE PE ORICE L\u0102\u021AIME DE ECRAN ----------------
           Un <select> sau un <input> cere implicit o l\u0103\u021Bime minim\u0103 dat\u0103 de cel
           mai lung text din el. \xCEn grilele de dou\u0103 coloane asta \xEEmpingea
           formularul dincolo de marginea ecranelor \xEEnguste, iar telefonul
           compensa mic\u0219or\xE2nd toat\u0103 pagina. L\u0103\u021Bimea minim\u0103 zero le las\u0103 s\u0103 se
           str\xE2ng\u0103 \xEEn coloana lor, oric\xE2t de \xEEngust ar fi ecranul. */
        html, body { overflow-x: hidden; }
        [data-skin] { overflow-x: hidden; }
        [data-skin] input, [data-skin] select, [data-skin] textarea { min-width: 0; max-width: 100%; }
        [data-skin] .grid > * { min-width: 0; }
        [data-skin] label { min-width: 0; }
        [data-skin] .overflow-y-auto { overflow-x: hidden; }
        [data-skin] select { text-overflow: ellipsis; }
        /* Pe ecrane foarte \xEEnguste, marginile se str\xE2ng pu\u021Bin ca s\u0103 r\u0103m\xE2n\u0103
           loc c\xE2mpurilor. */
        @media (max-width: 390px) {
          [data-skin] .px-5 { padding-left: 1rem; padding-right: 1rem; }
          [data-skin] .px-4 { padding-left: 0.875rem; padding-right: 0.875rem; }
          [data-skin] .gap-3 { gap: 0.5rem; }
        }

        /* ---------------------- COAJ\u0102 DE APLICA\u021AIE ----------------------
           Pagina \xEEn sine nu deruleaz\u0103 deloc: ecranul e \xEEmp\u0103r\u021Bit \xEEntr-o zon\u0103 de
           con\u021Binut care deruleaz\u0103 pe din\u0103untru \u0219i o bar\u0103 de taburi fix\u0103 jos, la
           \xEEndem\xE2na degetului mare. Sus, coaja las\u0103 liber decupajul barei de
           stare a telefonului. */
        [data-skin].min-h-screen {
          position: fixed; inset: 0;
          display: flex; flex-direction: column;
          overflow: hidden;
          min-height: 0;
          padding: env(safe-area-inset-top) 0 0 0 !important;
        }
        [data-skin] > nav.bg-white {
          position: static !important;
          flex: 0 0 auto;
          border-top: 1px solid var(--line);
          border-bottom: 0;
          padding-top: 0.375rem !important;
          padding-bottom: max(0.375rem, env(safe-area-inset-bottom)) !important;
        }
        /* Panoul filei active \u2014 singurul lucru care deruleaz\u0103. */
        [data-skin] > .pb-4,
        [data-skin] > .pb-6,
        [data-skin] > .min-h-screen {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
          padding-bottom: 6rem; /* loc sub ultima list\u0103 pentru butonul rotund */
        }
        [data-skin] .sheet-anim { max-height: 88% !important; }
        [data-skin] .fixed.bottom-20 { bottom: calc(5rem + env(safe-area-inset-bottom)); }
        [data-skin] .fixed.bottom-24 { bottom: calc(6.25rem + env(safe-area-inset-bottom)); }

        /* ------------------------ FIL\u0102 DE DOSAR -------------------------
           Fila activ\u0103 are col\u021Burile de jos rotunjite, culoarea proprie \u0219i se
           lipe\u0219te de panoul de deasupra ei, iar pagina prime\u0219te un contur \xEEn
           aceea\u0219i culoare, care se stinge spre interior. */
        [data-skin] > nav.bg-white {
          padding-top: 0 !important;
          border-top: 0;
        }
        [data-skin] > nav.bg-white button {
          border-radius: 0 0 13px 13px;
          padding-top: 0.45rem;
          border: 1px solid transparent;
          border-top: 0;
          transition: background .2s ease, border-color .2s ease;
        }
        [data-skin] > nav.bg-white button:has(.text-amber-600) {
          background: var(--accent-soft);
          border-color: var(--accent-line);
        }
        [data-skin] > .pb-4,
        [data-skin] > .pb-6,
        [data-skin] > .min-h-screen {
          border-bottom: 1px solid var(--accent-line);
          box-shadow: inset 0 -14px 30px -16px var(--accent);
        }

        /* --------------------------- TIP\u0102RIRE ---------------------------
           La tip\u0103rire (\u0219i la \u201ESalveaz\u0103 ca PDF") pleac\u0103 doar raportul, curat,
           pe alb, cu capul de tabel repetat pe fiecare pagin\u0103. Restul
           aplica\u021Biei se ascunde, iar coaja fix\u0103 e desf\u0103cut\u0103 ca s\u0103 nu taie
           con\u021Binutul la o singur\u0103 pagin\u0103. */
        @media print {
          @page { margin: 14mm 12mm; }
          html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
          body * { visibility: hidden !important; }
          .raport-print, .raport-print * { visibility: visible !important; }
          [data-skin].min-h-screen {
            position: static !important; display: block !important;
            overflow: visible !important; height: auto !important; padding: 0 !important;
            background: #fff !important; box-shadow: none !important;
          }
          .raport-overlay { position: absolute !important; inset: 0 auto auto 0 !important; width: 100% !important; background: #fff !important; }
          .raport-print {
            position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important;
            height: auto !important; max-height: none !important; overflow: visible !important;
            padding: 0 !important; background: #fff !important; color: #000 !important;
          }
          .raport-print .fara-print { display: none !important; }
          .raport-print .doar-print { display: block !important; }
          .raport-print * { color: #000 !important; }
          .raport-tabel { width: 100% !important; border-collapse: collapse !important; }
          .raport-tabel th, .raport-tabel td { border: 1px solid #999 !important; padding: 5pt 6pt !important; font-size: 10.5pt !important; }
          .raport-tabel thead { display: table-header-group !important; }
          .raport-tabel tr { break-inside: avoid !important; page-break-inside: avoid !important; }
          .raport-tabel tfoot td { font-weight: 700 !important; }
        }

        /* ------------------- BUTOANE SELECTATE -------------------
           Zilele de lucru, tema, zilele elevului, filtrele de sortare \u0219i
           ziua din calendar foloseau negrul de fundal, care noaptea se
           confunda cu cardul. Selec\u021Bia trece pe chihlimbariu, aceea\u0219i
           culoare cu conturul filei active. Butoanele mari de ac\u021Biune
           (Salveaz\u0103, Aplic\u0103 planul) r\u0103m\xE2n \xEEnchise \u2014 ele n-au bordur\u0103. */
        [data-skin] .bg-slate-900.border-slate-900 {
          background-color: var(--accent) !important;
          border-color: var(--accent) !important;
          box-shadow: 0 6px 14px -8px var(--accent);
        }
        [data-skin] .bg-slate-900.border-slate-900,
        [data-skin] .bg-slate-900.border-slate-900 * { color: #2a1800 !important; }
        [data-skin] .bg-slate-900.border-slate-900 .bg-amber-400,
        [data-skin] .bg-slate-900.border-slate-900 .bg-amber-500 { background-color: #2a1800 !important; }
